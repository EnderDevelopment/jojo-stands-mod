plugins {
    id 'fabric-loom' version '1.4-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'FabricMC Maven'
        url = 'https://maven.fabricmc.net/'
    }
}

extra {
    apply plugin: 'fabric-loom'
    loom {
        minecraftVersion = project.property('minecraft_version')
        loaderVersion = project.property('loader_version')
        accessWidenerPath = file('src/main/resources/accessWidener.txt').absolutePath
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:${project.property('minecraft_version')}'
    mappings 'net.fabricmc:yarn:${project.property('minecraft_version')}+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:${project.property('loader_version')}'
}

processResources {
    inputs.property 'version', project.property('mod_version')
}

jar {
    from {
        configurations.compileClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}
